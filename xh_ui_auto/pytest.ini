[pytest]
# ===== 测试路径与发现 =====
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ===== 命令行默认参数 =====
# -v: 详细模式 | --html: HTML 报告 | --reruns: 失败重试 1 次
addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    --reruns=1
    --reruns-delay=2

# ===== 自定义标记 =====
markers =
    negative: 反向/异常用例
    login: 登录模块
    logout: 登出模块
    register: 注册模块
    publish: 发布文章模块
    search: 搜索模块
    list: 列表/分类切换
    delete: 删除文章
    user_info: 个人信息模块

# ===== 日志 =====
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
