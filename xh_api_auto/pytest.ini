[pytest]
testpaths = script
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    -s
    --alluredir=report/allure-results
    --clean-alluredir
    --reruns=1
    --reruns-delay=2

markers =
    negative: 反向/异常用例
    smoke: 冒烟测试
    product: 商品服务模块
    cart: 购物车服务模块
    order: 订单服务模块
    payment: 支付服务模块
    coupon: 优惠券服务模块
    seckill: 秒杀服务模块
    review: 评价互动服务模块
    public: 公开接口（无需鉴权）
    auth: 需要登录的接口

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S